name: Build APK

on:
  push:
    branches: [android-port, main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # The SDK, NDK and p4a build artifacts are several GB and dominate the
      # run time, so they are keyed on buildozer.spec and reused until it moves.
      - name: Cache buildozer state
        uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer
            .buildozer
          # No restore-keys on purpose: a failed run can cache a half-installed
          # SDK, and falling back to it would poison every subsequent build.
          key: buildozer-${{ hashFiles('buildozer.spec') }}

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            git zip unzip autoconf libtool pkg-config \
            zlib1g-dev libncurses-dev libtinfo6 cmake libffi-dev libssl-dev ccache
          python -m pip install --upgrade pip
          pip install buildozer cython==0.29.36

      # Licences must not be seeded before this point. Creating
      # android-sdk/licenses/ makes buildozer report "Android SDK found" and skip
      # installing the SDK tools entirely, which then fails on a missing
      # sdkmanager. android.accept_sdk_license in buildozer.spec handles the
      # prompts instead, and the licence files are topped up afterwards for any
      # package sdkmanager pulls later.
      - name: Build debug APK
        run: |
          set -o pipefail
          buildozer -v android debug 2>&1 | tee build-output.log || {
            SDK=~/.buildozer/android/platform/android-sdk
            if [ -d "$SDK" ]; then
              mkdir -p "$SDK/licenses"
              echo "24333f8a63b6825ea9c5514f83c2829b004d1fee" > "$SDK/licenses/android-sdk-license"
              echo "84831b9409646a918e30573bab4c9c91346d8abd" > "$SDK/licenses/android-sdk-preview-license"
              echo "d975f751698a77b662f1254ddbeed3901e976f5a" > "$SDK/licenses/intel-android-extra-license"
              echo "Retrying after writing SDK licences"
              buildozer -v android debug 2>&1 | tee -a build-output.log
            else
              exit 1
            fi
          }

      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: BertAlert-debug-apk
          path: bin/*.apk
          if-no-files-found: error

      - name: Upload build log on failure
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: buildozer-failure-log
          path: |
            build-output.log
            .buildozer/android/platform/build-*/build.log
            .buildozer/**/*.log
          if-no-files-found: ignore
